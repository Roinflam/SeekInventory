# ========================================
# Configuration file version - DO NOT MODIFY!
# Config files will only be overwritten when the MAJOR version number (first digit) changes
# Example: 3.x.x → 4.0.0 will overwrite, but 3.0.0 → 3.1.0 will not
# ----------------------------------------
# 配置文件版本号 - 请勿修改！
# 只有当主版本号（第一个数字）发生变化时，插件才会自动覆盖所有配置文件
# 例如：3.x.x → 4.0.0 会覆盖，但 3.0.0 → 3.1.0 不会覆盖
# ========================================
ConfigVersion: '2.1.0'

# ========================================
# Language Settings
# 语言设置
# ========================================

# Available options:
#   default  - Auto-detect system language (recommended)
#   zh_cn    - Simplified Chinese
#   en_us    - English
# ----------------------------------------
# 可选值:
#   default  - 自动检测系统语言（推荐）
#   zh_cn    - 简体中文
#   en_us    - English
Language: default

# ========================================
# Automatic Backup Settings
# 自动备份设置
# ========================================

# Enable automatic periodic backup of online player inventories
# Set to false to disable automatic backups (manual backups still available)
# ----------------------------------------
# 是否启用定时自动保存
# 设置为 false 则禁用自动备份（仍可手动备份）
auto-save: true

# Backup interval in minutes
# Recommended: 30-60 minutes for optimal performance
# Minimum: 1 minute
# ----------------------------------------
# 保存间隔（分钟）
# 推荐：30-60 分钟以获得最佳性能
# 最小值：1 分钟
save-interval: 30

# Maximum number of backup snapshots to keep per player
# Older snapshots will be automatically deleted
# Recommended: 5-20 snapshots
# ----------------------------------------
# 每位玩家最多保存的快照数量
# 旧快照会被自动删除
# 推荐：5-20 个快照
max-snapshots: 10

# Automatically delete snapshots older than this many days
# Snapshots created before (current time - auto-clean-days) will be permanently removed
# This runs hourly alongside the max-snapshots cleanup
# Minimum: 1 day
# ----------------------------------------
# 自动清理超过指定天数的快照
# 超过此天数的快照将被永久删除
# 每小时与数量清理一起执行
# 最小值：1 天
auto-clean-days: 3

# ========================================
# Display Settings
# 显示设置
# ========================================

# Number of snapshot records to display per page
# Used in /seek timeinv and /seek timeend commands
# ----------------------------------------
# 每页显示的快照记录数
# 用于 /seek timeinv 和 /seek timeend 命令
page-size: 10

# ========================================
# Self-Service Claim Settings
# 自助领取设置
# ========================================
# Admins grant a player N claim credits for a snapshot type via
# /seekclaim grant <player> <inv|end|curios> <count> [hours].
# The player can then browse their own backups and take items with Shift+Left-Click.
# Each Shift+Left-Click consumes exactly 1 credit regardless of stack size.
# A given slot of a given snapshot can only ever be claimed once, so unique items
# cannot be duplicated even if the player still has credits left.
# ----------------------------------------
# 管理员通过 /seekclaim grant <玩家> <inv|end|curios> <次数> [小时] 发放领取额度。
# 玩家随后可以浏览自己的历史备份，用 Shift+左键领取物品。
# 每次 Shift+左键消耗 1 次额度，与该槽位是 1 个还是一组无关。
# 同一条快照的同一个槽位终身只能被领取一次，因此即使玩家仍有额度，
# 也无法把同一件独一无二的物品复制出多份。
claim:

  # Default validity period in hours when [hours] is omitted in the grant command
  # Range: 1 - 8760 (1 year)
  # ----------------------------------------
  # 发放命令省略 [小时] 参数时使用的默认有效期
  # 取值范围：1 - 8760（1 年）
  default-hours: 12

  # How many days to keep claim logs that have already been reported to admins
  # Unreported logs are never deleted - they wait for the first admin to log in
  # Minimum: 1 day
  # ----------------------------------------
  # 已上报给管理员的领取日志保留天数
  # 尚未上报的日志永不删除，会一直等到第一位管理员上线
  # 最小值：1 天
  log-keep-days: 30

  # When granting, if the target player is online and has no other container open,
  # pop up their backup list right away (otherwise they get a clickable chat button)
  # ----------------------------------------
  # 发放额度时，目标玩家在线且没开着别的界面，就直接弹出他的历史备份列表
  # （开着别的界面时只发聊天栏按钮，不打断他）
  auto-open-on-grant: true

  # Remind players who still have unused claim quota when they join
  # ----------------------------------------
  # 还有没用完的领取额度的玩家进服时提醒一次（带可点击按钮）
  join-reminder: true
